[package]
name = "reimage"
version = "1.0.0"
edition = "2021"
description = "High-performance image proxy and transformation service"
license = "MIT"

[dependencies]
# Async runtime — only the pieces actually used in the binary:
# rt-multi-thread + macros for #[tokio::main]/select!, net for TcpListener,
# signal for graceful shutdown, time for sleep/timeout, parking_lot for the
# faster mutex implementation. Trimmed from "full" to keep build smaller.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "parking_lot"] }

# Web framework. hyper/hyper-util are transitive via axum — no need to depend
# on them explicitly (we don't `use` them anywhere). tower-http only needs
# the `timeout` layer; tower is used for ServiceBuilder which is in its core.
axum = { version = "0.7", features = ["query", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["timeout"] }

# Image processing. Dropped `bmp`/`tiff`/`gif` features: none are common
# on proxied web traffic and decoding them inflates the binary by hundreds
# of KB. Requests for those content types still fail cleanly via decode err.
# Dropped `rayon` feature: we use rayon directly for composite/corner work;
# the image crate's internal parallel ops are not on the hot path.
image = { version = "0.25", features = ["webp", "jpeg", "png"] }
webp = "0.3"
resvg = "0.44"
# Direct font metrics for accurate text wrapping. Already pulled in transitively
# by resvg/usvg (0.24.x); depending on it directly lets us measure real glyph
# advance widths instead of guessing `font_size * 0.6` per character.
ttf-parser = "0.24"

# SIMD-accelerated resize (SSE4.1/AVX2/NEON). Replaces image::resize_exact
# on the hot path — typically 3-10x faster at the same visual quality.
fast_image_resize = { version = "6", features = ["rayon"] }

# Parallel processing for CPU-bound operations
rayon = "1.10"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip", "deflate"] }

# DNS resolver
hickory-resolver = "0.24"

# Caching
moka = { version = "0.12", features = ["future", "sync"] }

# Rate limiting
governor = "0.7"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_qs = "0.13"

# Configuration
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling. anyhow was only carried for the `Internal(#[from] anyhow::Error)`
# variant of AppError, but no call site ever constructed an anyhow::Error; the
# variant now holds a String directly so anyhow is gone.
thiserror = "2"

# Utilities
bytes = "1"
url = "2"
once_cell = "1"
parking_lot = "0.12"
ipnetwork = "0.20"
futures = "0.3"
async-trait = "0.1"

# Fast hashing for cache keys
ahash = "0.8"

# Fast multithreaded allocator. Image decode/encode/composite are very
# allocator-heavy and the default musl allocator (Alpine) is 3–5× slower
# than mimalloc on this workload. `default-features=false` disables the
# slower "secure" mode.
mimalloc = { version = "0.1", default-features = false }

# Security / Authentication
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
# Enable frame pointers for better profiling (minimal overhead)
debug = 0

[profile.release.build-override]
opt-level = 3

[profile.dev]
opt-level = 1
