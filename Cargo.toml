[package]
name = "reimage"
version = "1.0.0"
edition = "2021"
description = "High-performance image proxy and transformation service"
license = "MIT"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full", "parking_lot"] }

# Web framework
axum = { version = "0.7", features = ["query", "macros"] }
tower = { version = "0.5", features = ["timeout", "limit"] }
tower-http = { version = "0.6", features = ["timeout", "limit", "set-header", "trace"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio"] }

# Image processing - rayon enables parallel pixel operations
image = { version = "0.25", features = ["webp", "jpeg", "png", "gif", "bmp", "tiff", "rayon"] }
webp = "0.3"
resvg = "0.44"

# Parallel processing for CPU-bound operations
rayon = "1.10"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip", "deflate"] }

# DNS resolver
hickory-resolver = "0.24"

# Caching
moka = { version = "0.12", features = ["future", "sync"] }

# Rate limiting
governor = "0.7"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_qs = "0.13"

# Configuration
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Utilities
bytes = "1"
url = "2"
once_cell = "1"
parking_lot = "0.12"
ipnetwork = "0.20"
futures = "0.3"
async-trait = "0.1"

# Fast hashing for cache keys
ahash = "0.8"

# Fast multithreaded allocator. Image decode/encode/composite are very
# allocator-heavy and the default musl allocator (Alpine) is 3–5× slower
# than mimalloc on this workload. `default-features=false` disables the
# slower "secure" mode.
mimalloc = { version = "0.1", default-features = false }

# Security / Authentication
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
# Enable frame pointers for better profiling (minimal overhead)
debug = 0

[profile.release.build-override]
opt-level = 3

[profile.dev]
opt-level = 1
